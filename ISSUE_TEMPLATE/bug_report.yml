name: Bug report
description: Report something that is broken or behaving unexpectedly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security vulnerabilities, please use the channel described in [SECURITY.md](../../SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem, including what you expected instead.
      placeholder: When I do X, Y happens. I expected Z.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps. If the bug needs specific data or state, describe it.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe '...'
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit / URL
      description: Which version, deployment, or URL is affected?
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device, relevant configuration.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, errors
      description: Paste relevant console errors, server logs, or screenshots. Strip sensitive data.
    validations:
      required: false
